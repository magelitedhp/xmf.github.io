<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#132f27">
  <title>超级玛丽 · 蘑菇王国冒险</title>
  <style>/*__STYLE__*/</style>
</head>
<body>
  <main id="cabinet">
    <div id="viewport">
      <canvas id="game" width="960" height="540" tabindex="0" aria-label="超级玛丽游戏画面。方向键移动，空格跳跃，Shift 冲刺，X 发射火球，Esc 暂停。"></canvas>
      <div id="hud" class="hidden">
        <div class="hud-brand"><span class="red-dot"></span><b>MARIO</b><small id="score">000000</small></div>
        <div class="hud-collect"><span class="coin-icon"></span><b id="coins">00</b><span class="hud-divider"></span><span id="hearts">♥ ♥ ♥</span></div>
        <div class="hud-world"><small id="world-name">青风草原</small><b id="world">WORLD 1—1</b></div>
        <div class="hud-time"><small>TIME</small><b id="timer">300</b></div>
        <button id="pause" class="icon-button" aria-label="暂停游戏">Ⅱ</button>
      </div>
      <div id="medals" class="hidden" aria-label="本关星章"><span>★</span><span>★</span><span>★</span></div>
      <div id="toast" role="status"></div>
      <div id="overlay"></div>
      <div id="curtain"></div>
      <span class="screen-corner">YUMO / PLAY DEPT.</span>
    </div>
    <div id="touch-controls" aria-label="触屏控制">
      <div class="dpad"><button data-key="left" aria-label="向左">◀</button><button data-key="right" aria-label="向右">▶</button><button data-key="down" class="down-button" aria-label="蹲下或进入水管">▼</button></div>
      <span class="touch-hint">LET’S-A GO!</span>
      <div class="action-pad"><button data-key="run" class="run-button" aria-label="冲刺与发射火球">B<small>冲刺</small></button><button data-key="jump" class="jump-button" aria-label="跳跃">A<small>跳跃</small></button></div>
    </div>
    <footer class="game-footer"><span><i></i> A LITTLE ADVENTURE, A BIG BIG WORLD.</span><span class="keyboard-hint">← → 移动 <b>SPACE</b> 跳跃 <b>SHIFT</b> 冲刺</span><button id="sound" aria-label="切换声音" aria-pressed="true">♫ 声音开启</button></footer>
  </main>
  <script>/*__SCRIPT__*/</script>
</body>
</html>
